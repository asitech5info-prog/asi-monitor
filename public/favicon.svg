<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#0b111e" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.4"/>
  <!-- Glowing radar rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f2fe" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00f2fe" stroke-width="8" opacity="0.7" />
  <!-- Center pulse & eye / monitor icon -->
  <circle cx="256" cy="256" r="60" fill="url(#glow)" />
  <path d="M180 256 C200 210, 312 210, 332 256 C312 302, 200 302, 180 256 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="22" fill="#0b111e" />
  <circle cx="262" cy="250" r="8" fill="#00f2fe" />
</svg>