<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e1f38" />
      <stop offset="60%" stop-color="#070d18" />
      <stop offset="100%" stop-color="#03060b" />
    </radialGradient>
    
    <!-- Neon Blue-Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Radar Pulse Ring Gradient -->
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#neonCyan)" stroke-width="4" opacity="0.4" />

  <!-- Radar Monitoring Circles -->
  <circle cx="256" cy="235" r="150" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="12 8" opacity="0.25" />
  <circle cx="256" cy="235" r="110" fill="none" stroke="#00c6ff" stroke-width="3" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="256" cy="235" r="70" fill="none" stroke="url(#ringGlow)" stroke-width="4" opacity="0.6" />

  <!-- Center Pulse Target -->
  <circle cx="256" cy="235" r="38" fill="url(#neonCyan)" filter="url(#glowFilter)" />
  <circle cx="256" cy="235" r="18" fill="#ffffff" />
  <circle cx="256" cy="235" r="8" fill="#070d18" />

  <!-- High-tech Monitor Scope Lines -->
  <path d="M70 235 L190 235" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M322 235 L442 235" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M256 75 L256 175" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M256 295 L256 370" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Live Pulse Dot Top Right -->
  <circle cx="395" cy="115" r="10" fill="#00e676" filter="url(#glowFilter)" />
  <circle cx="395" cy="115" r="5" fill="#ffffff" />

  <!-- ASI Logo Typography at the bottom -->
  <text x="256" y="445" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">ASI</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="4">MONITOR</text>
</svg>
