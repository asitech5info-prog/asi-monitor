name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json

      - name: Fix Gradlew Permissions & Line Endings
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Install Android Platform 35 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace

      - name: Determine Release Tag & Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Locate and Stage APK
        run: |
          mkdir -p release-apk
          find android/ -name "*.apk" -exec cp -v {} release-apk/ \;
          if [ -f release-apk/app-debug.apk ]; then
            cp release-apk/app-debug.apk release-apk/ASI-Monitor-${{ steps.vars.outputs.tag }}.apk
          fi
          ls -la release-apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASI-Monitor-Debug-APK
          path: release-apk/
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ASI Monitor ${{ steps.vars.outputs.tag }} (Mobile Optimized APK)"
          body: |
            ## 📱 ASI Monitor ${{ steps.vars.outputs.tag }} - Android APK Direct Download

            ### 🚀 What's New:
            - **Accurate Followers**: Exact follower counts (e.g. `2,354`) formatted cleanly with commas, never rounded to `2.4K`.
            - **Mobile Viewport Optimization**: Zero horizontal clipping and full safe-area support for notches, punch-holes, and status bars.
            - **Clean Follower Cards**: Removed cramped reel/view cards so the dashboard focuses 100% on live page followers.
            - **Playwright Live Engine**: Headless browser scraper integration for accurate real-time metrics.

            ### 📥 Download & Install:
            - Download **`ASI-Monitor-${{ steps.vars.outputs.tag }}.apk`** (or `app-debug.apk`) below directly to your phone.
            - Tap the downloaded file to install on your Android device.
          files: |
            release-apk/*.apk
          make_latest: true
          fail_on_unmatched_files: false
