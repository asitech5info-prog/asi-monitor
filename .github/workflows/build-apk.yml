name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json

      - name: Fix Gradlew Permissions & Line Endings
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Install Android Platform 35 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p release-apk
          find . -name "*.apk" -exec cp -v {} release-apk/ \;
          ls -la release-apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASI-Monitor-Debug-APK
          path: release-apk/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ASI Monitor v1.0.0 (Android APK)"
          body: "Direct download for the ASI Monitor Android APK. Install `app-debug.apk` directly on your Android phone."
          files: release-apk/*.apk
          fail_on_unmatched_files: false
